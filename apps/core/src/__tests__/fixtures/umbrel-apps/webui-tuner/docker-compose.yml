version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: webui-tuner_web_1
      APP_PORT: 8080

  web:
    image: example/webui-tuner:0.4.1
    restart: on-failure
    environment:
      MODEL_URL: ${MODEL_HOST}
      LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
