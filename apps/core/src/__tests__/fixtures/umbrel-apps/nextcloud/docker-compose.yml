version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nextcloud_web_1
      APP_PORT: 80

  db:
    image: mariadb:10.11.5
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${APP_PASSWORD}
      - MYSQL_PASSWORD=${APP_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  redis:
    image: redis:7.2.4
    restart: on-failure

  web:
    image: nextcloud:30.0.2-apache
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/nextcloud:/var/www/html
    environment:
      - MYSQL_HOST=nextcloud_db_1
      - MYSQL_PASSWORD=${APP_PASSWORD}
      - REDIS_HOST=nextcloud_redis_1
      - NEXTCLOUD_ADMIN_USER=umbrel
      - NEXTCLOUD_ADMIN_PASSWORD=${APP_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${DEVICE_DOMAIN_NAME}:8081
    depends_on:
      - db
      - redis

  cron:
    image: nextcloud:30.0.2-apache
    restart: on-failure
    entrypoint: /cron.sh
    volumes:
      - ${APP_DATA_DIR}/data/nextcloud:/var/www/html
    depends_on:
      - db
      - redis
