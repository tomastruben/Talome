version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_HOST_IP
      APP_PORT: 8123

  server:
    image: homeassistant/home-assistant:2024.11.3
    network_mode: host
    privileged: true
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/config
      - /run/dbus:/run/dbus:ro
